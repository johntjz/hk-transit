name: Clean AI Studio Assets

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/aistudio/**'

permissions:
  contents: write

jobs:
  remove-aistudio-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove public/assets/aistudio
        run: |
          git rm -rf --ignore-unmatch public/assets/aistudio
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: strip auto-uploaded AI Studio prompt assets"
            git push
          fi
