name: Auto Stamp Version & HKT Build Time

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'version.json'
      - 'public/version.json'

permissions:
  contents: write

concurrency:
  group: stamp-version-main
  cancel-in-progress: false

jobs:
  stamp-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stamp HKT timestamp in index.html & version.json
        run: |
          export HKT_STAMP="$(TZ='Asia/Hong_Kong' date '+%Y-%m-%d %H:%M HKT')"
          export ISO_NOW="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          export SHORT_SHA="$(git rev-parse --short HEAD)"
          sed -i -E "s/[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} HKT/${HKT_STAMP}/g" index.html
          node -e '
            const fs = require("fs");
            let data = {};
            for (const vp of ["version.json", "public/version.json"]) {
              try {
                if (fs.existsSync(vp)) {
                  Object.assign(data, JSON.parse(fs.readFileSync(vp, "utf8")) || {});
                }
              } catch (_) {}
            }
            data.version = process.env.HKT_STAMP;
            data.appUpdated = process.env.ISO_NOW;
            data.commit = process.env.SHORT_SHA;
            const out = JSON.stringify(data, null, 2) + "\n";
            fs.mkdirSync("public", { recursive: true });
            fs.writeFileSync("public/version.json", out);
            if (fs.existsSync("version.json")) {
              fs.writeFileSync("version.json", out);
            }
          '

      - name: Commit updated version.json and index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/version.json
          if [ -f version.json ]; then git add version.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: stamp build timestamp (HKT)"
            git pull --rebase origin main
            git push
          fi
